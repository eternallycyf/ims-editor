name: Test CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: 🏗 准备 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 🗳 安装依赖
        run: pnpm install

      - name: ✅ 测试检查
        run: pnpm run test:coverage

      - name: ⬆️上传至 Codecov
        uses: codecov/codecov-action@v3
